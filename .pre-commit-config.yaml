# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Run with `pixi run lint`, which uses prek, cf. https://github.com/j178/prek
# The figures are excluded as the Noto Emoji SVGs must be kept unmodified,
# cf. figures/LICENSE-noto-emoji, and the lock files are generated by Pixi.
exclude: ^(figures/|(.*/)?pixi\.lock$)
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-added-large-files

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
    -   id: ruff-check
    -   id: ruff-format

-   repo: local
    hooks:
      - id: check-links
        name: Check links
        entry: pixi run check-links
        language: system
        types_or: [markdown, tex]
        pass_filenames: false
        stages: [pre-commit, manual]
